name: Update visual baselines

# Run this manually (Actions tab -> Update visual baselines -> Run workflow) the first time,
# and again whenever the UI changes on purpose. It takes fresh screenshots on Linux and
# commits them as the new approved baselines.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://www.saucedemo.com
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
      UPDATE_VISUAL_BASELINES: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Take new baseline screenshots
        run: npx playwright test --project=visual --update-snapshots=all
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "Update visual baselines"
            git push
          fi
